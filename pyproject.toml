[project]
name = "pricewatcher"
version = "0.1.0"
description = "Monitor de precos no varejo brasileiro com alerta no Telegram"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # curl_cffi, nao httpx: Pichau e Terabyte bloqueiam por fingerprint de TLS.
    # Ver secao 11.2 da SPEC.
    "curl_cffi>=0.16",
    "selectolax>=0.4",
    "pydantic>=2.10",
    "PyYAML>=6.0",
    "APScheduler>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pricewatcher = "pricewatcher.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
