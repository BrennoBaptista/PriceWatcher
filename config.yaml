# PriceWatcher -- configuracao de comportamento.
# Segredos NAO ficam aqui: vem do .env via ${VARIAVEL}.

schedule:
  # A cada 8 horas: 3 coletas por dia.
  times: ["00:00", "08:00", "16:00"]
  jitter_minutes: 15

http:
  timeout_seconds: 20
  delay_min_seconds: 2.0
  delay_max_seconds: 6.0
  retries: 3

notify:
  destinations:
    - id: grupo
      chat_id: ${TELEGRAM_GROUP_CHAT_ID}
      kinds: [price]          # todos os alertas de preco: GPU e console
    - id: brenno
      chat_id: ${TELEGRAM_CHAT_ID}
      kinds: [operational]    # so coletor quebrado; nao duplica alerta

stores:
  # v1 -- hardware
  kabum:      { enabled: true,  categories: [gpu, console] }
  pichau:     { enabled: true,  categories: [gpu, console] }
  terabyte:   { enabled: true,  categories: [gpu, console] }
  # Fase 5 -- varejo generalista. Ambas rodam VTEX e usam o MESMO adapter,
  # parametrizado pelo dominio. Ver secao 18 da SPEC.
  casaevideo: { enabled: true, categories: [console], platform: vtex,
                base_url: "https://www.casaevideo.com.br" }
  americanas: { enabled: true, categories: [console], platform: vtex,
                base_url: "https://www.americanas.com.br" }

  # Diretamente inacessiveis: as tres ficam atras do Akamai Bot Manager, que
  # exige execucao de JavaScript, e o servidor nao comporta navegador headless
  # (secao 12). Sao alcancadas indiretamente pelo agregador abaixo.
  casasbahia: { enabled: false, categories: [console] }
  ponto:      { enabled: false, categories: [console] }
  magalu:     { enabled: false, categories: [console] }

  # Comparador de precos. Existe para alcancar APENAS o que nao raspamos
  # direto. Zoom, Buscape e Bondfaro sao o mesmo backend -- configurar mais de
  # um seria coletar o mesmo dado tres vezes.
  zoom:
    enabled: true
    categories: [gpu, console]
    platform: agregador
    base_url: "https://www.zoom.com.br"
    # So estas. KaBuM!, Pichau e Terabyte saem daqui de proposito: ja temos o
    # preco delas de primeira mao, e aceitar as duas fontes duplicaria alerta.
    merchants: ["Magazine Luiza", "Amazon", "Fast Shop", "Casas Bahia", "Ponto"]
    # Coletamos direto: servem para o --auditoria conferir se o preco que o
    # agregador publica bate com o que buscamos na propria loja.
    merchants_auditoria: ["KaBuM!", "Pichau", "Terabyte"]

targets:
  - id: RX_9070_XT
    category: gpu
    label: "Radeon RX 9070 XT"
    search_terms: ["rx 9070 xt"]
    match_regex: '(?i)\b(rx\s*)?9070\s*xt\b'
    # A busca das lojas devolve PC montado que apenas menciona a placa.
    exclude:
      # '^pc' pega "PC IA EXPERT", "PC Gamer", "PC Pro". A faixa de sanidade
      # flagrou dois desses a R$ 21k e R$ 32k que a lista antiga deixava passar.
      - '(?i)^\s*pc\b'
      - '(?i)\b(pc\s*gamer|computador|notebook|desktop|kit\s*upgrade)\b'
    sanity_price_range_brl: [2000, 15000]

  - id: RTX_5070_TI
    category: gpu
    label: "GeForce RTX 5070 Ti"
    search_terms: ["rtx 5070 ti"]
    match_regex: '(?i)\b(rtx\s*)?5070\s*ti\b'
    exclude:
      # '^pc' pega "PC IA EXPERT", "PC Gamer", "PC Pro". A faixa de sanidade
      # flagrou dois desses a R$ 21k e R$ 32k que a lista antiga deixava passar.
      - '(?i)^\s*pc\b'
      - '(?i)\b(pc\s*gamer|computador|notebook|desktop|kit\s*upgrade)\b'
    sanity_price_range_brl: [2500, 18000]

  - id: PS5
    category: console
    label: "PlayStation 5"
    search_terms: ["playstation 5", "console ps5"]
    include_bundles: true
    require_all: ['(?i)\b(playstation\s*5|ps5)\b']
    # ATENCAO: a palavra "console" sozinha NAO serve de sinal positivo. Acessorio
    # em portugues se anuncia como "para console PS5" -- revisao manual pegou
    # mochila, cabo flat, chave Torx, tampa e PlayStation Portal passando por
    # console. O sinal confiavel e o titulo COMECAR com "console", ou declarar
    # capacidade de armazenamento.
    require_any:
      - '(?i)^\s*(novo\s+|kit\s+)?console\b'
      - '(?i)\b(825\s*gb|[12]\s*tb)\b'
    # Rede de seguranca: substantivos que nomeiam acessorio. "controle" e "jogo"
    # continuam fora da lista de proposito -- bundle legitimo os contem.
    exclude:
      - '(?i)\b(mochila|bolsa|saco|estojo|maleta|capa|skin|pel[íi]cula|adesivo)\b'
      - '(?i)\b(cabo|flat|flex|carregador|dock|base\s+de|suporte|stand)\b'
      - '(?i)\b(chave|torx|kit\s+\d|parafus)'
      - '(?i)\b(tampa|face\s*plate|placa\s+frontal|shell|painel|cover)\b'
      - '(?i)\b(ventilador|resfriamento|cooler|refrigera)'
      - '(?i)\b(adaptador|conversor|reprodutor|portal|headset|fone)\b'
      - '(?i)\b(cart[ãa]o|gift\s*card|psn|assinatura|jogo\s+para)\b'
      # Comeca com o nome do acessorio. NAO usar '\bssd\b' solto: console
      # legitimo se chama "Console Sony PlayStation 5, SSD 825GB". O que
      # denuncia o acessorio e ele ABRIR o titulo -- mesma logica do '^pc'
      # usado nas GPUs. Um SSD de 2TB tem "PS5" e "2TB" no titulo e custa
      # R$ 3.500: sem isto, viraria "minimo historico do PS5 Pro".
      - '(?i)^\s*(ssd|hd|mem[óo]ria|placa|fonte|gabinete|monitor|cadeira|mouse|teclado)\b'
    # Ordem importa: primeiro match vence. 'Pro' antes de 'Digital'.
    variants:
      - { key: PS5_PRO,          match_regex: '(?i)\bpro\b' }
      - { key: PS5_SLIM_DIGITAL, match_regex: '(?i)\bdigital\b' }
      - { key: PS5_SLIM_DISC,    default: true }
    sanity_price_range_brl: [2000, 9000]

alerts:
  new_low:
    enabled: true
    min_observations: 3
    min_drop_percent: 1.0
    min_drop_brl: 100
    # Acompanha o intervalo de coleta. Cooldown maior que o intervalo
    # silenciaria rodadas inteiras. Nao ha risco de spam: o alerta exige minimo
    # historico NOVO, entao para disparar de novo o preco precisa cair outros
    # R$ 100 abaixo do que ja era o menor -- isso e noticia.
    cooldown_hours: 8
  back_in_stock:
    enabled: true
    cooldown_hours: 24
